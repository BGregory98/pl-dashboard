  ["Huddersfield Town", "Huddersfield"],
  ["Leicester City", "Leicester"],
  ["Coventry City", "Coventry"],
  ["Hull City", "Hull"],
  ["Ipswich Town", "Ipswich"],
  ["Leeds United", "Leeds"],
  ["Stoke City", "Stoke"],

  ["Norwich City", "Norwich"],
  ["Derby County", "Derby"],
  ["Middlesbrough", "Boro"],

const short = name => SHORT.get(name) ?? name;

const titleSet = new Set(sd.filter(d => d.p_title > 0.01).map(d => d.club));
const relegSet = new Set(sd.filter(d => d.p_releg > 0.05).map(d => d.club));
return {endYear,sd,mws,maxMw,latest,n,SHORT,short,titleSet,relegSet};
}});

define({id: "2a7825dc", inputs: ["sd","Plot","n","maxMw","short","d3","width"], outputs: ["braid"], body: (sd,Plot,n,maxMw,short,d3,width) => {

    }),
    Plot.dot(braid.filter(d => d.mw === maxMw), {

    }),
    Plot.text(braid.filter(d => d.mw === maxMw), {

    Plot.tip(braid, Plot.pointer({
      x: "mw",

      stroke: "club",
      channels: {Points: "pts_now", GD: "gd_now"}
    }))
  ],
  x: {label: "Matchweek", domain: [0, Math.max(maxMw + 4, 38)]},
  y: {

  width,

  marginRight: 130

}});
