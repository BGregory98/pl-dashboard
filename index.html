return {endYear,sd,mws,maxMw,prevMw,latest,prev,prevMap,n,SHORT,short,labelMr,showLabels,titleSet,relegSet};

define({id: "1201e1fe", inputs: ["prevMap","latest","n","short","display"], outputs: ["fmtPct","chg","chgPts","rowCls","tableRows","wrapper"], body: (prevMap,latest,n,short,display) => {
function fmtPct(v) {
  if (v < 0.001) return '<span class="dim">—</span>';
  if (v >= 0.995) return "99+";
  return (v * 100).toFixed(1);
}

function chg(cur, club, field, invert) {
  const p = prevMap.get(club);
  if (!p) return "";
  const d = cur - p[field];
  const pp = d * 100;
  if (Math.abs(pp) < 0.05) return "";
  const sign = pp > 0 ? "+" : "";
  const cls = invert ? (d > 0 ? "dn" : "up") : (d > 0 ? "up" : "dn");
  return `<span class="chg ${cls}">${sign}${pp.toFixed(1)}</span>`;
}

function chgPts(cur, club) {
  const p = prevMap.get(club);
  if (!p) return "";
  const d = cur - p.exp_pts;
  if (Math.abs(d) < 0.05) return "";
  const sign = d > 0 ? "+" : "";
  const cls = d > 0 ? "up" : "dn";
  return `<span class="chg ${cls}">${sign}${d.toFixed(1)}</span>`;
}

function rowCls(rank, n) {
  if (rank <= 5) return "hi-top4";
  if (rank > n - 3) return "hi-releg";
  return "";
}

const tableRows = latest.map((d, i) => `<tr class="${rowCls(i + 1, n)}">
  <td>${i + 1}</td>
  <td>${short(d.club)}</td>
  <td><span class="val">${d.exp_pts.toFixed(1)}</span> ${chgPts(d.exp_pts, d.club)}</td>
  <td>${fmtPct(d.p_title)} ${chg(d.p_title, d.club, "p_title", false)}</td>
  <td>${fmtPct(d.p_top5)} ${chg(d.p_top5, d.club, "p_top5", false)}</td>
  <td>${fmtPct(d.p_releg)} ${chg(d.p_releg, d.club, "p_releg", true)}</td>
</tr>`).join("\n");

const wrapper = document.createElement("div");
wrapper.style.overflowX = "auto";
wrapper.innerHTML = `<table class="pred-table">
<thead><tr><th>#</th><th>Club</th><th>xPts</th><th>Title</th><th>UCL</th><th>Releg</th></tr></thead>
<tbody>${tableRows}</tbody>
</table>`;
display(wrapper);
return {fmtPct,chg,chgPts,rowCls,tableRows,wrapper};
}});
