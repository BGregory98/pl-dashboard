function repel(data, yKey, gap) {
  const arr = data.map(d => ({...d, _ly: d[yKey]}));
  arr.sort((a, b) => a._ly - b._ly);
  if (arr.length < 2) return arr;
  for (let iter = 0; iter < 20; iter++) {
    let moved = false;
    for (let i = 1; i < arr.length; i++) {
      const overlap = gap - (arr[i]._ly - arr[i - 1]._ly);

define({id: "3af28dba", inputs: ["prevMap","latest","n","short","display"], outputs: ["fmtPct","chg","chgPts","chgVal","rowCls","tableRows","wrapper"], body: (prevMap,latest,n,short,display) => {
function fmtPct(v) {
  if (v < 0.001) return '<span class="dim">—</span>';
  if (v >= 0.995) return "99+";
  return (v * 100).toFixed(1);
}

function chg(cur, club, field, invert) {
  const p = prevMap.get(club);
  if (!p) return "";
  const d = cur - p[field];
  const pp = d * 100;
  if (Math.abs(pp) < 0.05) return "";
  const sign = pp > 0 ? "+" : "";
  const cls = invert ? (d > 0 ? "dn" : "up") : (d > 0 ? "up" : "dn");
  return `<span class="chg ${cls}">${sign}${pp.toFixed(1)}</span>`;
}

function chgPts(cur, club) {
  const p = prevMap.get(club);
  if (!p) return "";
  const d = cur - p.exp_pts;
  if (Math.abs(d) < 0.05) return "";
  const sign = d > 0 ? "+" : "";
  const cls = d > 0 ? "up" : "dn";
  return `<span class="chg ${cls}">${sign}${d.toFixed(1)}</span>`;
}

function chgVal(cur, club, field) {
  const p = prevMap.get(club);
  if (!p) return "";
  const d = cur - p[field];
  if (Math.abs(d) < 0.5) return "";
  const sign = d > 0 ? "+" : "";
  const cls = d > 0 ? "up" : "dn";
  return `<span class="chg ${cls}">${sign}${Math.round(d)}</span>`;
}

function rowCls(rank, n) {
  if (rank <= 5) return "hi-top4";
  if (rank > n - 3) return "hi-releg";
  return "";
}

const tableRows = latest.map((d, i) => `<tr class="${rowCls(i + 1, n)}">
  <td>${i + 1}</td>
  <td>${short(d.club)}</td>
  <td>${d.played}</td>
  <td><span class="val">${d.pts_now}</span> ${chgVal(d.pts_now, d.club, "pts_now")}</td>
  <td><span class="val">${d.exp_pts.toFixed(1)}</span> ${chgPts(d.exp_pts, d.club)}</td>
  <td>${fmtPct(d.p_title)} ${chg(d.p_title, d.club, "p_title", false)}</td>
  <td>${fmtPct(d.p_top4)} ${chg(d.p_top4, d.club, "p_top4", false)}</td>
  <td>${fmtPct(d.p_releg)} ${chg(d.p_releg, d.club, "p_releg", true)}</td>
</tr>`).join("\n");

const wrapper = document.createElement("div");
wrapper.style.overflowX = "auto";
wrapper.innerHTML = `<table class="pred-table">
<thead><tr><th>#</th><th>Club</th><th>Pld</th><th>Pts</th><th>xPts</th><th>Title</th><th>Top 4</th><th>Releg</th></tr></thead>
<tbody>${tableRows}</tbody>
</table>`;
display(wrapper);
return {fmtPct,chg,chgPts,chgVal,rowCls,tableRows,wrapper};
}});

define({id: "ac3fd42e", inputs: ["d3","sd","maxMw"], outputs: ["expBraid","expLatest"], body: (d3,sd,maxMw) => {
const expBraid = (() => {
  const byMw = d3.group(sd, d => d.mw);
  const out = [];
  for (const [mw, group] of byMw) {
    const sorted = [...group].sort((a, b) => a.exp_pos - b.exp_pos);
    sorted.forEach((d, i) => {
      out.push({...d, yPos: i + 1});
    });
  }
  return out;
})();
const expLatest = expBraid.filter(d => d.mw === maxMw);
return {expBraid,expLatest};
}});
